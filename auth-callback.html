<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <title>Conectando · AURORA DJ Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.callback-page{min-height:100svh;display:grid;place-items:center;padding:24px;background:#070a0f;color:#eef7f8}
    .callback-card{width:min(100%,430px);padding:32px 28px;border:1px solid #5be6ed55;border-radius:24px;background:#0d1d26ee;box-shadow:0 24px 70px #0008;text-align:center}
    .callback-spinner{width:34px;height:34px;margin:0 auto 20px;border:3px solid #5be6ed33;border-top-color:#5be6ed;border-radius:50%;animation:spin .8s linear infinite}
    .callback-card h1{margin:0 0 10px;font-size:26px}.callback-card p{margin:0;color:#a8bdc1;line-height:1.6;font-size:14px}
    .callback-error{color:#ff9d9d!important}.callback-link{display:inline-block;margin-top:20px;color:#5be6ed;text-decoration:none;font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="callback-page">
  <div class="liquid liquid-a"></div><div class="liquid liquid-b"></div><div class="grid-glow"></div>
  <main class="callback-card">
    <div class="callback-spinner" id="spinner"></div>
    <h1 id="title">Conectando sua conta</h1>
    <p id="message">Aguarde um instante. Você será levado ao Studio automaticamente.</p>
  </main>
  <script>
    (async () => {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const spinner = document.getElementById('spinner');
      const params = new URLSearchParams(window.location.hash.slice(1));
      const error = params.get('error');
      if (error) {
        spinner.style.display = 'none';
        title.textContent = 'Login não concluído';
        message.textContent = params.get('error_description') || 'O Google cancelou a autenticação. Tente novamente.';
        message.classList.add('callback-error');
        const link = document.createElement('a'); link.className = 'callback-link'; link.href = '/login.html'; link.textContent = 'Voltar ao login'; document.querySelector('.callback-card').appendChild(link);
        return;
      }
      const token = params.get('access_token');
      const returnedState = params.get('state');
      const expectedState = localStorage.getItem('aurora-oauth-state');
      if (!token || (expectedState && returnedState !== expectedState)) {
        spinner.style.display = 'none';
        title.textContent = 'Não foi possível concluir';
        message.textContent = 'A resposta do Google está incompleta ou expirou. Volte ao login e tente novamente.';
        message.classList.add('callback-error');
        const link = document.createElement('a'); link.className = 'callback-link'; link.href = '/login.html'; link.textContent = 'Voltar ao login'; document.querySelector('.callback-card').appendChild(link);
        return;
      }
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const response = await fetch('https://openidconnect.googleapis.com/v1/userinfo', {headers: {Authorization: 'Bearer ' + token}, signal: controller.signal});
        clearTimeout(timeout);
        if (!response.ok) throw new Error('userinfo');
        const profile = await response.json();
        if (!profile.email) throw new Error('email');
        try { await fetch('/api/admin-session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({accessToken: token})}); } catch (_) {}
        localStorage.setItem('aurora-google-email', profile.email);
        localStorage.setItem('aurora-auth-v3', '1');
        if (profile.name) localStorage.setItem('aurora-google-name', profile.name);
        localStorage.removeItem('aurora-oauth-state');
        history.replaceState({}, document.title, window.location.pathname);
        window.location.replace('/');
      } catch (_) {
        spinner.style.display = 'none';
        title.textContent = 'Não foi possível validar a conta';
        message.textContent = 'A confirmação do Google demorou ou foi bloqueada. Verifique a URI de redirecionamento no Google Cloud e tente novamente.';
        message.classList.add('callback-error');
        const link = document.createElement('a'); link.className = 'callback-link'; link.href = '/login.html'; link.textContent = 'Tentar novamente'; document.querySelector('.callback-card').appendChild(link);
      }
    })();
  </script>
</body>
</html>
